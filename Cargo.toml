[package]
name = "gxpad"
version = "0.1.0"
edition = "2024"
description = "2D constraint-based geometry pad that derives closed-form formulas for measured dimensions"
license = "GPL-3.0-or-later"

[workspace]
members = ["gxgeo"]

[dependencies]
gxgeo = { path = "gxgeo" }
eframe = "0.37"
rfd = "0.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
