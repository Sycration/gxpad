[package]
name = "sgcli"
version = "0.3.2"
edition = "2024"
description = "An interactive command line for sgpad's geometry, in the statements of the .sgp format"
license = "GPL-3.0-or-later"

[[bin]]
name = "sgcli"
path = "src/main.rs"

[dependencies]
sggeo = { path = "../sggeo" }
# with-dirs (the home crate) would import a function Windows XP does not have; sgcli finds ~ itself
rustyline = { version = "17.0.2", default-features = false, features = ["with-file-history"] }
