[package]
name = "sgweb"
version = "0.3.2"
edition = "2024"
description = "A web app for constructing 2D geometry with constraints and deriving closed-form formulas, served from one binary"
license = "GPL-3.0-or-later"

[[bin]]
name = "sgweb"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"

# build.rs builds the sggeo Wasm module (unless SGWEB_SGGEO_PKG names a prebuilt one) and compresses the
# web app into the binary
[build-dependencies]
flate2 = "1.1"
