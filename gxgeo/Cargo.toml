[package]
name = "gxgeo"
version = "0.1.0"
edition = "2024"
description = "Geometry model, constraint solver, and closed-form formula derivation for gxpad"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
serde_json = "1"
