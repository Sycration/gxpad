language = "C"
include_guard = "GXGEO_H"
cpp_compat = true
documentation_style = "c99"
usize_is_size_t = true
sys_includes = ["stddef.h"]
no_includes = true
# Visual C++ has stdint.h from 2010 (_MSC_VER 1600) and stdbool.h from 2013 (_MSC_VER 1800)
after_includes = """
#if defined(_MSC_VER) && _MSC_VER < 1600
typedef unsigned __int8 uint8_t;
typedef unsigned __int32 uint32_t;
typedef unsigned __int64 uint64_t;
#else
#include <stdint.h>
#endif
#ifndef __cplusplus
#if defined(_MSC_VER) && _MSC_VER < 1800
#ifndef bool
#define bool unsigned char
#define true 1
#define false 0
#endif
#else
#include <stdbool.h>
#endif
#endif"""
header = "/* gxgeo C interface. Generated by cbindgen from src/ffi.rs; do not edit. */"

[parse]
parse_deps = false

[export]
include = ["GxFormula", "GxTarget"]
# internal items of the crate that cbindgen would otherwise pick up
exclude = ["X_SYM", "Y_SYM", "TX_SYM", "TY_SYM", "TMP_BASE", "CSE_BASE", "TOL", "Dd", "ConKind", "DimType"]
